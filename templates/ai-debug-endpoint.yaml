id: ai-debug-endpoint
info:
  name: ai-debug-endpoint
  author: Epsilon0xCell
  severity: high
  description: Detects ai-debug-endpoint exposure on an AI application.
http:
  - method: GET
    path:
      - "/debug"
    matchers:
      - type: status
        status: [200]
      - type: word
        words:
          - "debug enabled"
