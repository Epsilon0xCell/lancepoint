id: ai-exposed-mcp-server
info:
  name: ai-exposed-mcp-server
  author: Epsilon0xCell
  severity: high
  description: Detects ai-exposed-mcp-server exposure on an AI application.
http:
  - method: GET
    path:
      - "/mcp"
    matchers:
      - type: status
        status: [200]
      - type: word
        words:
          - "run_shell"
