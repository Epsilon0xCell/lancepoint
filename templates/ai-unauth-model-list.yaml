id: ai-unauth-model-list
info:
  name: ai-unauth-model-list
  author: Epsilon0xCell
  severity: high
  description: Detects ai-unauth-model-list exposure on an AI application.
http:
  - method: GET
    path:
      - "/v1/models"
    matchers:
      - type: status
        status: [200]
      - type: word
        words:
          - "data"
