id: ai-unauth-chat-completions
info:
  name: ai-unauth-chat-completions
  author: Epsilon0xCell
  severity: high
  description: Detects ai-unauth-chat-completions exposure on an AI application.
http:
  - method: GET
    path:
      - "/v1/chat/completions"
    matchers:
      - type: status
        status: [200]
      - type: word
        words:
          - "choices"
